name: CI

# The package is bash and python behind a Node command line, so the matrix is
# about the runner, not about Node: what has to hold is that a stranger can
# install this and have it work. test/install.sh does exactly that -- packs,
# installs into a scratch Node project, runs init, runs doctor.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: Install into a scratch project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # jq and python3 are what the harness itself needs on the runner. Named
      # here rather than assumed, so a change in the runner image shows up as a
      # clear failure instead of a confusing one.
      - name: Check the runner has what the harness needs
        run: |
          set -euo pipefail
          for tool in bash jq python3; do
            command -v "$tool" >/dev/null || { echo "missing: $tool" >&2; exit 1; }
            echo "$tool: $($tool --version 2>&1 | head -n1)"
          done

      - name: npm test
        run: npm test

  shellcheck:
    name: Lint the shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -x follows `source` so common.sh is analysed with its callers.
          # Failures are advisory for now: the scripts predate this lint and a
          # red board nobody can fix is a board nobody reads.
          shellcheck -x -S error lib/*.sh test/*.sh || {
            echo "::warning::shellcheck reported errors"
            exit 0
          }
